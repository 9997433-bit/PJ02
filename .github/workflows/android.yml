# =============================================================
# MagTile Studio - Android 构建流水线 (CI)
#
# 两个任务 (详见 magtile-studio/platforms/android/README.md):
#   ndk-so:         纯 NDK 交叉编译 libmagtile_core.so + JNI 符号断言
#                   —— 持续保证 magtile_core 无平台依赖 (ROADMAP 移动端前提)
#   assemble-debug: Gradle 全量打包 debug APK (含 data/ 子集 + 缩略图
#                   assets) 并上传为构建产物, 可直接侧载安装体验模型库
# =============================================================
name: Android

on:
  push:
    paths:
      - "magtile-studio/platforms/android/**"
      - "magtile-studio/src/**"
      - "magtile-studio/include/**"
      - "magtile-studio/third_party/**"
      - "magtile-studio/CMakeLists.txt"
      - ".github/workflows/android.yml"
  workflow_dispatch:

env:
  NDK_VERSION: 27.2.12479018   # r27c, 与 app/build.gradle.kts ndkVersion 一致

jobs:
  ndk-so:
    name: ndk-so (交叉编译 + JNI 符号断言)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: magtile-studio

    steps:
      - uses: actions/checkout@v4

      # GitHub runner 预装 Android SDK (ANDROID_HOME 已设置, 许可已接受),
      # 按固定版本补装 NDK, 与 Gradle 工程使用同一工具链
      - name: 安装固定版本 NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"

      - name: 交叉编译 libmagtile_core.so (arm64-v8a)
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android

      # 十二个 JNI 入口一个都不能少 (Kotlin 侧 external fun 与之一一对应:
      # MainActivity = 模型库链路, MagTileNative = 进度存档/磁力片库存/
      # 年龄段设置/进度页与成就墙链路)
      - name: 断言 JNI 符号齐全
        run: |
          NM="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          SO=build-android/platforms/android/libmagtile_core.so
          for symbol in \
            MainActivity_loadCatalog MainActivity_listModels \
            MainActivity_validateModel MainActivity_getTutorialStepCount \
            MagTileNative_openProgressStore MagTileNative_inventoryRows \
            MagTileNative_saveInventory MagTileNative_canBuildModel \
            MagTileNative_missingPiecesJson \
            MagTileNative_ageModeId MagTileNative_setAgeModeId \
            MagTileNative_progressOverviewJson; do
            "$NM" -D --defined-only "$SO" | grep -q "Java_com_magtile_studio_$symbol" \
              || { echo "缺少 JNI 符号: $symbol"; exit 1; }
          done
          echo "JNI 符号断言通过"

  assemble-debug:
    name: assemble-debug (Gradle 打包 APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: magtile-studio/platforms/android

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 缓存 Gradle 依赖与 wrapper 发行版, 加速重复构建
      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 固定版本 NDK 与 CMake 由 AGP 按 build.gradle.kts 声明自动补装
      # (runner 的 SDK 许可已接受), 无需手工 sdkmanager
      - name: 打包 debug APK
        run: ./gradlew :app:assembleDebug

      - name: 校验 APK 内容 (原生库 + 数据资产 + 缩略图)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmagtile_core.so" || { echo "APK 缺少原生库"; exit 1; }
          unzip -l "$APK" | grep -q "assets/data/tile_catalog.json"   || { echo "APK 缺少形状目录"; exit 1; }
          unzip -l "$APK" | grep -q "assets/data/model_catalog.json"  || { echo "APK 缺少模型库目录"; exit 1; }
          MODEL_COUNT=$(unzip -l "$APK" | grep -c 'assets/data/models/.*\.json')
          THUMB_COUNT=$(unzip -l "$APK" | grep -c 'assets/thumbnails/.*\.png')
          echo "模型 JSON 数量: $MODEL_COUNT / 缩略图 PNG 数量: $THUMB_COUNT"
          # 缩略图为 0 说明 assets/thumbnails 打包接线坏了, 硬性失败
          [ "$THUMB_COUNT" -gt 0 ] || { echo "APK 缺少缩略图 (assets/thumbnails 未打包)"; exit 1; }
          # 缩略图按 thumbnails/<id>.png 约定与模型对应; 内容制作期新模型
          # 的缩略图可能滞后生成, 数量落后只告警不失败 (缺图卡片显示占位)
          [ "$THUMB_COUNT" -ge "$MODEL_COUNT" ] || echo "::warning::缩略图数量 ($THUMB_COUNT) 少于模型数量 ($MODEL_COUNT), 新模型缩略图待生成"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: magtile-studio-debug-apk
          path: magtile-studio/platforms/android/app/build/outputs/apk/debug/app-debug.apk
